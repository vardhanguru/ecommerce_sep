{% extends "base.html" %}

{% block title %}Your Profile | OneStop Shopping{% endblock %}

{% block extra_css %}
<style>
    .account-page {
        width: min(100% - 32px, 680px);
        margin: 0 auto;
        padding: 52px 0 72px;
    }

    .account-panel {
        padding: 38px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 22px;
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.07);
        animation: account-enter 350ms ease-out both;
    }

    .account-heading { margin-bottom: 26px; }
    .account-kicker {
        margin-bottom: 8px;
        color: #0071e3;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
    }
    .account-heading h1 {
        margin: 0 0 9px;
        color: #1d1d1f;
        font-size: 30px;
        line-height: 1.2;
    }
    .account-heading p { color: #6e6e73; font-size: 15px; line-height: 1.5; }

    .account-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px;
    }
    .account-field label {
        display: block;
        margin-bottom: 7px;
        color: #333336;
        font-size: 14px;
        font-weight: 600;
    }
    .account-field input,
    .account-field textarea {
        width: 100%;
        min-height: 46px;
        padding: 11px 13px;
        border: 1px solid #d2d2d7;
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: #1d1d1f;
        font: inherit;
        transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    .account-field textarea {
        min-height: 100px;
        resize: vertical;
    }
    .account-field input:focus,
    .account-field textarea:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
    }
    .account-field input[readonly] {
        background: #f5f5f7;
        color: #6e6e73;
        cursor: not-allowed;
    }
    .account-field-wide,
    .account-actions { grid-column: 1 / -1; }
    .account-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 4px;
    }
    .account-submit {
        min-height: 46px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #0071e3;
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
        transition: background 180ms ease, transform 180ms ease;
    }
    .account-submit:hover { background: #0077ed; transform: translateY(-1px); }
    .account-back {
        color: #0066cc;
        font-size: 14px;
        font-weight: 650;
    }
    .account-back:hover { text-decoration: underline; }

    @keyframes account-enter {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
        .account-page { padding: 32px 0 56px; }
        .account-panel { padding: 28px 22px; border-radius: 16px; }
        .account-form { grid-template-columns: 1fr; }
        .account-field-wide,
        .account-actions { grid-column: auto; }
        .account-actions { align-items: stretch; flex-direction: column-reverse; }
        .account-submit { width: 100%; }
        .account-back { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
        .account-panel { animation: none; }
        .account-field input,
        .account-field textarea,
        .account-submit { transition: none; }
    }
</style>
{% endblock %}

{% block content %}
<main class="account-page">
    <section class="account-panel" aria-labelledby="profile-title">
        <header class="account-heading">
            <p class="account-kicker">OneStop Shopping</p>
            <h1 id="profile-title">Your profile</h1>
            <p>Keep your contact and delivery details up to date.</p>
        </header>

        <form class="account-form" method="post" action="{% url 'profile' %}">
            {% csrf_token %}
            <div class="account-field">
                <label for="first_name">First name</label>
                <input id="first_name" type="text" name="first_name" value="{{ user.first_name }}" autocomplete="given-name">
            </div>
            <div class="account-field">
                <label for="last_name">Last name</label>
                <input id="last_name" type="text" name="last_name" value="{{ user.last_name }}" autocomplete="family-name">
            </div>
            <div class="account-field">
                <label for="email">Email</label>
                <input id="email" type="email" value="{{ user.email }}" autocomplete="email" readonly>
            </div>
            <div class="account-field">
                <label for="phone_number">Phone number</label>
                <input id="phone_number" type="tel" name="phone_number" value="{{ user.phone_number }}" autocomplete="tel">
            </div>
            <div class="account-field account-field-wide">
                <label for="address">Delivery address</label>
                <textarea id="address" name="address" autocomplete="street-address" rows="4">{{ user.address }}</textarea>
            </div>
            <div class="account-actions">
                <a class="account-back" href="{% url 'storefront_home' %}">Back to store</a>
                <button class="account-submit" type="submit">Save changes</button>
            </div>
        </form>
    </section>
</main>
{% endblock %}
